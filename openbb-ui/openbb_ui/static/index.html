<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenBB UI</title><style>:root{font:15px system-ui;color:#e9eefb;background:#0b1020}body{margin:0}.app{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.muted{color:#9ca9c7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.card{border:1px solid #2a3859;background:#131d34;border-radius:12px;padding:18px}.status{color:#f2c868}.table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;padding:10px;border-bottom:1px solid #293657}.error{color:#ff8494}@media(max-width:700px){.app{padding:16px}.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}}
</style></head><body><main class="app"><header class="top"><div><div class="muted">OPENBB UI / READ-ONLY</div><h1>Workspace overview</h1></div><button onclick="loadDashboard()">Refresh</button></header><section class="grid"><article class="card"><div class="muted">Data source</div><strong id="source">Loading…</strong></article><article class="card"><div class="muted">Freshness</div><strong id="freshness">Loading…</strong></article><article class="card"><div class="muted">Portfolio</div><strong id="portfolio">Loading…</strong></article></section><section class="card"><h2>Observations</h2><div id="state" class="status">Loading read model…</div><table class="table"><thead><tr><th>Symbol</th><th>Metric</th><th>Value</th><th>Observed</th><th>Source</th></tr></thead><tbody id="observations"></tbody></table></section></main><script>async function loadDashboard(){const s=document.getElementById('state');s.textContent='Loading read model…';try{const r=await fetch('/api/dashboard',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();source.textContent=d.source;freshness.textContent=d.freshness;portfolio.textContent=d.portfolio.available?'Available':'Not available';s.textContent=d.observations.length+' observation(s) · '+(d.modules.openbb_api||'unknown');observations.innerHTML=d.observations.map(o=>`<tr><td>${o.symbol}</td><td>${o.metric}</td><td>${o.value}</td><td>${o.observed_at}</td><td>${o.source}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No observations available.</td></tr>'}catch(e){s.className='error';s.textContent='Dashboard unavailable: '+e.message}}loadDashboard();setInterval(loadDashboard,15000)</script></body></html>
