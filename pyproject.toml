[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1.0"
description = "Modular paper-trading application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.44,<0.45",
    "yfinance>=0.2.63,<0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["trading_agent*"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2", "responses>=0.25,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: explicit read-only checks against Alpaca paper"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/trading_agent/brokers"]
